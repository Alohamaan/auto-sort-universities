[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "admissions-email-reconciliation-agent"
version = "0.1.0"
description = "Skeleton project for admissions email reconciliation workflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "sqlalchemy>=2.0.30",
  "python-dotenv>=1.0.1",
  "google-api-python-client>=2.154.0",
  "google-auth>=2.36.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["admissions_agent"]
